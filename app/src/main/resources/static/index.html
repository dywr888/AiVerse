<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiVerse Web</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface2:#f0f1f4; --border:#e2e5ea;
  --text:#1a1d21; --text2:#6b7280; --text3:#9aa1ab;
  --accent:#3b82f6; --accent2:#2563eb; --accent-soft:#eef4ff;
  --danger:#ef4444; --danger-soft:#fee2e2;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 3px rgba(0,0,0,.07);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
}
#app{display:flex;flex-direction:column;height:100vh}
/* svg icon */
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-2px}
/* ── header ── */
header{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ── layout ── */
.layout{display:flex;flex:1;min-height:0}
/* ── sidebar ── */
.sidebar{
  width:300px;min-width:300px;display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--border);
}
.search-box{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:6px}
.search-box input{
  flex:1;background:var(--surface2);border:1px solid transparent;border-radius:var(--radius-sm);
  padding:8px 10px;color:var(--text);font-size:13px;outline:none;
}
.search-box input:focus{border-color:var(--accent);background:var(--surface)}
.search-box button{
  background:var(--surface2);border:none;border-radius:var(--radius-sm);padding:0 9px;
  cursor:pointer;color:var(--text2);display:flex;align-items:center;
}
.search-box button:hover{background:var(--border);color:var(--text)}
.session-list{flex:1;overflow-y:auto;padding:6px}
.session-item{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-sm);
  cursor:pointer;margin-bottom:2px;border:1px solid transparent;
}
.session-item:hover{background:var(--surface2)}
.session-item.active{background:var(--accent-soft);border-color:var(--accent)}
.session-item .s-main{flex:1;min-width:0}
.session-item .s-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .s-meta{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.session-item .s-actions{display:none;gap:2px;flex-shrink:0}
.session-item:hover .s-actions{display:flex}
.icon-btn{
  width:26px;height:26px;border:none;background:transparent;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text2);
}
.icon-btn:hover{background:var(--border);color:var(--text)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.badge{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--surface2);color:var(--text2);margin-left:4px}
.badge.sub{background:#fef3c7;color:#b45309}
.empty{padding:24px 16px;text-align:center;color:var(--text3);font-size:13px}
/* ── main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-header{
  display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.chat-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-info{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header .h-actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.model-select{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 8px;font-size:12px;color:var(--text);outline:none;max-width:180px;cursor:pointer;
}
.model-select:focus{border-color:var(--accent)}
.btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{background:var(--border)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* messages */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.msg.tool{align-self:flex-start;align-items:flex-start}
.msg.system{align-self:center;align-items:center;max-width:100%}
.msg.error{align-self:center;align-items:center}
.msg-role{font-size:11px;color:var(--text2);margin-bottom:3px;padding:0 4px;display:flex;align-items:center;gap:4px}
.msg-bubble{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 13px;box-shadow:var(--shadow);word-break:break-word;
}
.msg.user .msg-bubble{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg.assistant .msg-bubble{background:var(--surface)}
.msg.system .msg-bubble{background:var(--surface2);color:var(--text2);font-size:12px;border-style:dashed}
.msg.error .msg-bubble{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);font-size:13px}
.msg-time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.msg-bubble pre{
  background:#f6f8fa;border:1px solid var(--border);border-radius:6px;padding:8px;
  overflow-x:auto;font-size:12px;margin:6px 0;
}
.msg-bubble code{background:var(--surface2);border-radius:4px;padding:1px 4px;font-size:12px}
.msg-bubble pre code{background:transparent;padding:0}
.msg-bubble table{border-collapse:collapse;margin:6px 0;font-size:12px}
.msg-bubble th,.msg-bubble td{border:1px solid var(--border);padding:4px 8px}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{margin:8px 0 4px;line-height:1.3}
.msg-bubble p{margin:4px 0}
.msg-bubble ul,.msg-bubble ol{margin:4px 0 4px 20px}
.msg-bubble a{color:var(--accent)}
details.tool-call{margin-top:6px;font-size:12px}
details.tool-call summary{cursor:pointer;color:var(--text2);font-size:11px;display:flex;align-items:center;gap:4px}
details.tool-call .tc-body{padding:8px;background:var(--surface2);border-radius:6px;margin-top:4px;color:var(--text);font-family:monospace;font-size:11px;white-space:pre-wrap;max-height:220px;overflow-y:auto}
/* loading */
.loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:32px;color:var(--text2)}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* input bar */
.input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);align-items:flex-end}
.input-bar textarea{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);padding:10px 12px;font-size:14px;resize:none;max-height:130px;font-family:inherit;line-height:1.4;outline:none;
}
.input-bar textarea:focus{border-color:var(--accent);background:var(--surface)}
.input-bar .send{background:var(--accent);color:#fff;border:none;padding:10px 18px;font-weight:600;white-space:nowrap}
.input-bar .send:hover{background:var(--accent2)}
.input-bar .send:disabled{opacity:.5;cursor:not-allowed}
/* files panel */
.files-panel{
  position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:50;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;
}
.files-panel.open{transform:translateX(0)}
.files-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700}
.files-head .close{margin-left:auto}
.files-list{flex:1;overflow-y:auto;padding:6px}
.file-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:12px;font-family:monospace;
}
.file-item:hover{background:var(--surface2)}
.file-item .f-icon{flex-shrink:0;color:var(--text2)}
.file-item .f-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .f-path{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  width:400px;max-width:100%;max-height:90vh;overflow-y:auto;padding:20px;
}
.modal h3{margin-bottom:14px;font-size:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;color:var(--text);font-size:13px;outline:none;
}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);background:var(--surface)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d21;color:#fff;
  padding:10px 18px;border-radius:var(--radius);font-size:13px;z-index:100;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;
}
.toast.show{opacity:1}
/* responsive */
@media(max-width:720px){
  .sidebar{width:230px;min-width:230px}
  .msg{max-width:95%}
  .header-right .model-select{max-width:120px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="dot">A</span> AiVerse</div>
    <div class="header-right">
      <select class="model-select" id="modelSelect" onchange="switchModel()">
        <option value="">加载模型…</option>
      </select>
      <button class="btn" onclick="openAddModel()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加模型</button>
      <button class="btn" onclick="toggleFiles()"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>文件</button>
      <button class="btn" onclick="loadSessions()" title="刷新会话"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="search-box">
        <input id="search" placeholder="搜索会话…" oninput="renderSessionList(allSessions)">
        <button onclick="newSession()" title="新建会话"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="session-list" id="sessionList">
        <div class="empty">加载中…</div>
      </div>
    </aside>
    <main class="main">
      <div class="chat-header">
        <div style="min-width:0">
          <div class="chat-title" id="sessionTitle">未选择会话</div>
          <div class="chat-info" id="sessionInfo">从左侧选择或新建会话</div>
        </div>
        <div class="h-actions">
          <button class="icon-btn" onclick="renameSession()" title="重命名"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="icon-btn" onclick="refreshMessages()" title="重新加载"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
          <button class="icon-btn danger" onclick="deleteSession()" title="删除"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="empty">从左侧选择一个会话查看消息</div>
      </div>
      <div class="input-bar">
        <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行…" rows="1"></textarea>
        <button class="btn send" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </main>
  </div>
</div>

<!-- files panel -->
<div class="files-panel" id="filesPanel">
  <div class="files-head">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>工作区文件</span>
    <button class="icon-btn close" onclick="toggleFiles()"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div style="padding:8px 14px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border)" id="filesPath"></div>
  <div class="files-list" id="filesList"><div class="empty">点击加载文件列表</div></div>
</div>

<!-- add model modal -->
<div class="modal-overlay" id="modelModal" onclick="if(event.target===this)closeAddModel()">
  <div class="modal">
    <h3>添加模型</h3>
    <div class="form-group">
      <label>提供商</label>
      <select id="addModelProvider"></select>
    </div>
    <div class="form-group">
      <label>模型名</label>
      <input id="addModelName" placeholder="如 gpt-4o-mini, claude-3-5-sonnet…">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModel()">取消</button>
      <button class="btn primary" onclick="addModel()">添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let allSessions=[], allModels=[], currentSessionId=null, pollTimer=null;
// svg icons
const I={
  chat:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  wrench:'<svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z"/></svg>',
  alert:'<svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>',
  file:'<svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></svg>',
  image:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 21"/></svg>',
  folder:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>',
  brain:'<svg class="ic" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-5 0V4.5A2.5 2.5 0 0 1 9.5 2zM14.5 2A2.5 2.5 0 0 1 17 4.5v15a2.5 2.5 0 0 1-5 0V4.5A2.5 2.5 0 0 1 14.5 2z"/></svg>'
};
function fileIcon(name){
  if(/\.(png|jpe?g|gif|webp|svg)$/i.test(name))return I.image;
  if(/\.(kt|java|py|js|ts|html|css|md|json|xml|sh|go|rs|cpp|c|h)$/i.test(name))return I.file;
  return I.file;
}
// ── utils ──
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,dur=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),dur)}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`}
function fmtTokens(a,b){const f=n=>{if(!n)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n};return `${f(a)}/${f(b)} tok`}
function modeBadge(m){const map={BUILD:'构建',PLAN:'计划',AUTO:'自动'};return map[m]||m||''}

// ── markdown ──
function md(text){
  let t=esc(text);
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>'<pre><code>'+code+'</code></pre>');
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  t=t.replace(/^\s*\d+\. (.*)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ol>$1</ol>');
  t=t.split('\n\n').map(p=>{if(/^\s*<(pre|ul|ol|h\d|blockquote)/.test(p))return p;return p.includes('\n')?'<p>'+p.replace(/\n/g,'<br>')+'</p>':'<p>'+p+'</p>'}).join('');
  return t;
}

// ── render message ──
function renderToolCall(name,args,content){
  const argsStr=(args||'').slice(0,300);
  return `<details class="tool-call"><summary>${I.wrench} ${esc(name||'工具')}</summary><div class="tc-body">${esc(argsStr)}${content?('\n\n'+esc(content)):''}</div></details>`;
}
function renderMessage(msg){
  let cls='assistant',role=msg.role||'';
  if(role==='user')cls='user';
  else if(role==='tool')cls='tool';
  else if(role==='system'||role==='compaction')cls='system';
  let content=msg.content||'',extra='';
  if(msg.toolName){extra=renderToolCall(msg.toolName,msg.toolArgs,content.slice(0,500));content='';}
  if(msg.reasoning){
    extra=`<details style="margin:4px 0"><summary style="cursor:pointer;color:var(--text2);font-size:.75rem;display:flex;align-items:center;gap:4px">${I.brain}思考过程</summary><div style="padding:8px;color:var(--text2);font-size:.8rem;white-space:pre-wrap">${esc(msg.reasoning)}</div></details>`+extra;
  }
  if(msg.isCompactionMarker||msg.isContextSummary){
    return `<div class="msg system"><div class="msg-bubble">— ${msg.isCompactionMarker?'前面的消息已被压缩':'上下文摘要'} —</div></div>`;
  }
  const roleLabel={user:'你',assistant:'AI',tool:'工具',system:'系统'}[role]||role;
  if(msg.isError)cls='error';
  return `<div class="msg ${cls}">
    <div class="msg-role">${cls==='error'?I.alert:''}${roleLabel}${msg.toolName?' · '+esc(msg.toolName):''}</div>
    ${content?`<div class="msg-bubble">${md(content)}</div>`:''}
    ${extra}
    <div class="msg-time">${fmtTime(msg.timestamp)}</div>
  </div>`;
}

// ── sessions ──
async function loadSessions(){
  try{
    const r=await fetch('/api/sessions');
    const data=await r.json();
    allSessions=data||[];
    renderSessionList(allSessions);
  }catch(e){$('#sessionList').innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`}
}
function renderSessionList(sessions){
  const filter=$('#search').value.toLowerCase();
  let list=sessions;
  if(filter)list=sessions.filter(s=>(s.title||'').toLowerCase().includes(filter));
  list.sort((a,b)=>(b.isPinned?1:0)-(a.isPinned?1:0)||b.updatedAt-a.updatedAt);
  if(!list.length){$('#sessionList').innerHTML='<div class="empty">没有会话</div>';return}
  $('#sessionList').innerHTML=list.map(s=>{
    const sub=s.parentId?'<span class="badge sub">子</span>':'';
    const pin=s.isPinned?`<span title="置顶">${I.pin}</span>`:'';
    const mdl=s.model?`<span class="badge">${esc(s.model)}</span>`:'';
    return `<div class="session-item ${s.id===currentSessionId?'active':''}" onclick="selectSession('${s.id}')">
      <div class="s-main">
        <div class="s-title">${pin}${sub}${esc(s.title||'(无标题)')}${mdl}</div>
        <div class="s-meta">${modeBadge(s.mode)} ${fmtTokens(s.totalInputTokens,s.totalOutputTokens)} · ${fmtTime(s.updatedAt)}</div>
      </div>
      <div class="s-actions">
        <button class="icon-btn" onclick="event.stopPropagation();renameSession('${s.id}')" title="重命名"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deleteSession('${s.id}')" title="删除"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button>
      </div>
    </div>`;
  }).join('');
}
async function selectSession(id){
  currentSessionId=id;
  if(pollTimer)clearInterval(pollTimer);
  const s=allSessions.find(x=>x.id===id);
  if(s){
    $('#sessionTitle').textContent=s.title||'(无标题)';
    let info=modeBadge(s.mode)+' ';
    if(s.model)info+=s.model+' · ';
    info+=fmtTokens(s.totalInputTokens,s.totalOutputTokens);
    if(s.goal)info+=' · 目标 '+s.goal;
    $('#sessionInfo').innerHTML=info;
  }
  renderSessionList(allSessions);
  await refreshMessages();
  pollTimer=setInterval(refreshMessages,5000);
}
async function newSession(){toast('发送第一条消息会自动创建会话')}

// ── messages ──
async function refreshMessages(){
  if(!currentSessionId){return}
  const box=$('#messages');
  if(!box.querySelector('.msg')){box.innerHTML='<div class="loading"><span class="spinner"></span>加载中…</div>'}
  try{
    const r=await fetch(`/api/sessions/${currentSessionId}/messages`);
    const data=await r.json();
    const msgs=data||[];
    if(!msgs.length){$('#messages').innerHTML='<div class="empty">没有消息，输入内容开始对话</div>';return}
    $('#messages').innerHTML=msgs.map(renderMessage).join('');
    $('#messages').scrollTop=$('#messages').scrollHeight;
  }catch(e){
    $('#messages').innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}
async function sendMessage(){
  const input=$('#messageInput');
  const text=input.value.trim();
  if(!text||!currentSessionId){if(!text)toast('请输入消息');return}
  input.value='';
  const sendBtn=$('#sendBtn');
  sendBtn.disabled=true;
  try{
    const r=await fetch(`/api/sessions/${currentSessionId}/messages`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.ok===false){
      const err=data.error||('发送失败 ('+r.status+')');
      $('#messages').insertAdjacentHTML('beforeend',`<div class="msg error"><div class="msg-bubble">${I.alert} ${esc(err)}</div></div>`);
      $('#messages').scrollTop=$('#messages').scrollHeight;
    }else{
      toast('已发送');await refreshMessages();
    }
  }catch(e){
    $('#messages').insertAdjacentHTML('beforeend',`<div class="msg error"><div class="msg-bubble">${I.alert} ${esc(e.message)}</div></div>`);
    $('#messages').scrollTop=$('#messages').scrollHeight;
  }finally{sendBtn.disabled=false}
}

// ── session manage ──
async function deleteSession(id){
  id=id||currentSessionId;
  if(!id)return;
  if(!confirm('确定删除该会话？将同时删除子会话和消息。'))return;
  try{
    const r=await fetch(`/api/sessions/${id}`,{method:'DELETE'});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.ok===false){toast(data.error||'删除失败');return}
    toast('已删除');
    if(id===currentSessionId){currentSessionId=null;$('#sessionTitle').textContent='未选择会话';$('#sessionInfo').textContent='从左侧选择或新建会话';$('#messages').innerHTML='<div class="empty">会话已删除</div>'}
    await loadSessions();
  }catch(e){toast('删除失败：'+e.message)}
}
async function renameSession(id){
  id=id||currentSessionId;
  if(!id)return;
  const s=allSessions.find(x=>x.id===id);
  const newTitle=prompt('重命名会话：',s? s.title : '');
  if(newTitle===null)return;
  const title=newTitle.trim();
  if(!title)return;
  try{
    const r=await fetch(`/api/sessions/${id}/title`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.ok===false){toast(data.error||'重命名失败');return}
    toast('已重命名');await loadSessions();
    if(id===currentSessionId)$('#sessionTitle').textContent=title;
  }catch(e){toast('重命名失败：'+e.message)}
}

// ── models ──
async function loadModels(){
  try{
    const r=await fetch('/api/models');
    const data=await r.json();
    allModels=data||[];
    const sel=$('#modelSelect');
    const cur=allSessions.find(s=>s.id===currentSessionId);
    let html='<option value="">选择模型…</option>';
    allModels.forEach(p=>{
      const models=p.models&&p.models.length?p.models:[p.selectedModel].filter(Boolean);
      models.forEach(m=>{
        const val=JSON.stringify({providerId:p.id,model:m});
        const label=`${p.name} · ${m}`;
        const selected=(cur&&cur.providerId===p.id&&cur.model===m)?' selected':'';
        html+=`<option value="${esc(val)}"${selected}>${esc(label)}</option>`;
      });
    });
    if(!allModels.length)html='<option value="">无模型（先在 App 添加提供商）</option>';
    sel.innerHTML=html;
  }catch(e){console.warn('loadModels',e)}
}
async function switchModel(){
  const raw=$('#modelSelect').value;
  if(!raw||!currentSessionId)return;
  let opt;try{opt=JSON.parse(raw)}catch(e){return}
  try{
    const r=await fetch(`/api/sessions/${currentSessionId}/model`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({providerId:opt.providerId,model:opt.model})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.ok===false){toast(data.error||'切换失败');return}
    toast('已切换模型');await loadSessions();
  }catch(e){toast('切换失败：'+e.message)}
}
function openAddModel(){
  if(!allModels.length){toast('请先在 App 添加提供商');return}
  const sel=$('#addModelProvider');
  sel.innerHTML=allModels.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  $('#addModelName').value='';
  $('#modelModal').classList.add('open');
}
function closeAddModel(){$('#modelModal').classList.remove('open')}
async function addModel(){
  const providerId=$('#addModelProvider').value;
  const model=$('#addModelName').value.trim();
  if(!model){toast('请输入模型名');return}
  try{
    const r=await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({providerId,model})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||data.ok===false){toast(data.error||'添加失败');return}
    toast('已添加模型');closeAddModel();await loadModels();
  }catch(e){toast('添加失败：'+e.message)}
}

// ── files ──
function toggleFiles(){
  const p=$('#filesPanel');
  if(p.classList.contains('open')){p.classList.remove('open');return}
  p.classList.add('open');
  loadFiles();
}
async function loadFiles(){
  const list=$('#filesList');
  list.innerHTML='<div class="loading"><span class="spinner"></span>加载文件…</div>';
  try{
    const r=await fetch('/api/files');
    const data=await r.json();
    const files=data||[];
    $('#filesPath').textContent=`共 ${files.length} 个文件 · 点击复制路径`;
    if(!files.length){$('#filesList').innerHTML='<div class="empty">无文件或工作区未就绪</div>';return}
    $('#filesList').innerHTML=files.map(f=>{
      return `<div class="file-item" onclick="copyFile('${esc(f.path)}')" title="${esc(f.path)}">
        <span class="f-icon">${fileIcon(f.name)}</span>
        <div style="min-width:0">
          <div class="f-name">${esc(f.name)}</div>
          <div class="f-path">${esc(f.path)}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){$('#filesList').innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`}
}
function copyFile(path){
  navigator.clipboard.writeText(path).then(()=>toast('已复制：'+path)).catch(()=>toast('复制失败'));
}

// ── init ──
$('#messageInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
loadSessions();loadModels();
setInterval(loadSessions,30000);
setInterval(()=>{if(currentSessionId)loadModels()},30000);
</script>
</body>
</html>
