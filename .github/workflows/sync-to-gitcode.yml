name: Sync to GitCode

# 每天北京时间 0:00 / 6:00 / 12:00 / 18:00 自动同步到 GitCode 镜像仓库
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # UTC，对应北京时间 0/6/12/18
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查哈希并推送代码与 Tag
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          GITHUB_SHA=$(git rev-parse HEAD)
          echo ":: GitHub main HEAD: $GITHUB_SHA"

          GITCODE_SHA=$(curl -sf --max-time 15 \
            "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/commits?access_token=${GITCODE_TOKEN}&sha=main&per_page=1" \
            | jq -r '.[0].sha // ""' 2>/dev/null || echo "")
          echo ":: GitCode main HEAD: ${GITCODE_SHA:-（空，首次推送）}"

          if [ -n "$GITCODE_SHA" ] && [ "$GITHUB_SHA" = "$GITCODE_SHA" ]; then
            echo ":: 哈希相同，跳过推送"
          else
            git remote add gitcode https://qldwi:${GITCODE_TOKEN}@gitcode.com/qldwi/aiverse.git
            git push gitcode main --force --tags 2>&1
            git remote remove gitcode
            echo ":: 推送完成"
          fi

      - name: 同步 Release 公告与附件到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x  # 打开命令追踪，每条命令都会输出

          echo "=== 1/4 获取 GitHub Releases ==="
          GITHUB_RELEASES=$(curl -sf --max-time 30 \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yhdmgf/AiVerse/releases?per_page=100")

          if ! echo "$GITHUB_RELEASES" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "GitHub API 返回非数组，跳过"
            echo "$GITHUB_RELEASES" | head -c 300
            exit 0
          fi

          COUNT=$(echo "$GITHUB_RELEASES" | jq 'length')
          echo ":: 共 ${COUNT} 个 Release"

          echo "$GITHUB_RELEASES" | jq -c '.[]' | while IFS= read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            ASSET_COUNT=$(echo "$release" | jq '.assets | length')

            STATUS="latest"
            [ "$PRERELEASE" = "true" ] && STATUS="pre"

            echo ""
            echo "=== 处理 Release: ${TAG}（${ASSET_COUNT} 个附件）==="

            # 2/4 创建或更新 Release
            PAYLOAD=$(jq -n \
              --arg tag "$TAG" --arg name "$NAME" --arg body "$BODY" --arg status "$STATUS" \
              '{tag_name: $tag, name: $name, body: $body, release_status: $status}')

            echo ":: 检查 GitCode 是否已有 ${TAG}..."
            HTTP=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" \
              "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/tags/${TAG}?access_token=${GITCODE_TOKEN}")
            echo ":: GitCode 检查结果: HTTP ${HTTP}"

            if [ "$HTTP" = "200" ]; then
              RID=$(curl -sf --max-time 15 \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/tags/${TAG}?access_token=${GITCODE_TOKEN}" \
                | jq -r '.id')
              echo ":: 更新 Release (id=${RID})..."
              curl -sf --max-time 15 -X PATCH \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/${RID}?access_token=${GITCODE_TOKEN}" \
                -H "Content-Type: application/json" -d "$PAYLOAD" > /dev/null
              echo ":: 更新完成"
            else
              echo ":: 创建 Release..."
              curl -sf --max-time 15 -X POST \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases?access_token=${GITCODE_TOKEN}" \
                -H "Content-Type: application/json" -d "$PAYLOAD" > /dev/null
              echo ":: 创建完成"
            fi

            # 3/4 同步附件（APK）
            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo ":: 无附件，跳过"
              continue
            fi

            echo "$release" | jq -c '.assets[]' | while IFS= read -r asset; do
              ASSET_URL=$(echo "$asset" | jq -r '.browser_download_url')
              ASSET_NAME=$(echo "$asset" | jq -r '.name')
              ASSET_SIZE=$(echo "$asset" | jq -r '.size')

              echo ""
              echo ":: 附件: ${ASSET_NAME}（$((ASSET_SIZE / 1024 / 1024))MB）"

              # 下载
              echo ":: 下载中..."
              curl -sfL --max-time 120 -# \
                -H "Authorization: token ${GH_TOKEN}" \
                -o "/tmp/${ASSET_NAME}" "${ASSET_URL}"
              DL_SIZE=$(stat -c%s "/tmp/${ASSET_NAME}" 2>/dev/null || echo 0)
              echo ":: 下载完成: $((DL_SIZE / 1024 / 1024))MB"

              # 获取上传 URL
              echo ":: 获取 GitCode 上传 URL..."
              UPLOAD_RESP=$(curl -sf --max-time 15 \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/${TAG}/upload_url?access_token=${GITCODE_TOKEN}&file_name=${ASSET_NAME}")

              UPLOAD_URL=$(echo "$UPLOAD_RESP" | jq -r '.url // empty')
              if [ -z "$UPLOAD_URL" ]; then
                echo "!! 获取 upload_url 失败"
                echo "响应: $(echo "$UPLOAD_RESP" | head -c 300)"
                rm -f "/tmp/${ASSET_NAME}"
                continue
              fi
              echo ":: upload_url 获取成功"

              # 构造 headers
              HEADER_ARGS=()
              while IFS=$'\t' read -r key val; do
                HEADER_ARGS+=("-H" "${key}: ${val}")
              done < <(echo "$UPLOAD_RESP" | jq -r '.headers | to_entries[] | "\(.key)\t\(.value)"')

              # 上传
              echo ":: 上传到 OBS..."
              UPLOAD_HTTP=$(curl -s --max-time 300 -X PUT \
                "${UPLOAD_URL}" "${HEADER_ARGS[@]}" \
                --upload-file "/tmp/${ASSET_NAME}" \
                -w "%{http_code}" -o /tmp/upload_resp.txt)

              echo ":: 上传结果: HTTP ${UPLOAD_HTTP}"
              if [ "$UPLOAD_HTTP" != "200" ] && [ "$UPLOAD_HTTP" != "204" ]; then
                echo "!! 上传失败，响应: $(cat /tmp/upload_resp.txt | head -c 300)"
              fi

              rm -f "/tmp/${ASSET_NAME}" /tmp/upload_resp.txt
            done

            echo ":: Release ${TAG} 完成"
          done

          echo ""
          echo "=== 4/4 全部同步完成 ==="
