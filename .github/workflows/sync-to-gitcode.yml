name: Sync to GitCode

# 每天北京时间 0:00 / 6:00 / 12:00 / 18:00 自动同步到 GitCode 镜像仓库
# 也支持手动触发
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # UTC 时间，对应北京时间 0/6/12/18
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查哈希并推送代码与 Tag
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          GITHUB_SHA=$(git rev-parse HEAD)
          echo "GitHub main HEAD: $GITHUB_SHA"

          GITCODE_SHA=$(curl -sf \
            "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/commits?access_token=${GITCODE_TOKEN}&sha=main&per_page=1" \
            | jq -r '.[0].sha // ""' 2>/dev/null || echo "")
          echo "GitCode main HEAD: ${GITCODE_SHA:-（空，首次推送）}"

          if [ -n "$GITCODE_SHA" ] && [ "$GITHUB_SHA" = "$GITCODE_SHA" ]; then
            echo "哈希相同（$GITHUB_SHA），跳过推送"
          else
            git remote add gitcode https://qldwi:${GITCODE_TOKEN}@gitcode.com/qldwi/aiverse.git
            git push gitcode main --force --tags
            git remote remove gitcode
            echo "推送完成: $GITHUB_SHA → GitCode"
          fi

      - name: 同步 Release 公告与附件到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.parse, tempfile

          GITCODE_TOKEN = os.environ['GITCODE_TOKEN']
          GH_TOKEN = os.environ['GH_TOKEN']
          GITCODE_API = 'https://api.gitcode.com/api/v5/repos/qldwi/aiverse'
          GITHUB_API = 'https://api.github.com/repos/yhdmgf/AiVerse'

          def api_get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              return urllib.request.urlopen(req)

          def api_json(url, headers=None, data=None, method=None):
              req = urllib.request.Request(url, headers=headers or {}, data=data, method=method)
              return json.loads(urllib.request.urlopen(req).read())

          # 获取 GitHub Releases
          try:
              releases = api_json(f'{GITHUB_API}/releases?per_page=100',
                  headers={'Authorization': f'token {GH_TOKEN}', 'Accept': 'application/vnd.github+json'})
          except Exception as e:
              print(f'获取 GitHub Releases 失败: {e}')
              exit(0)

          if not isinstance(releases, list):
              print('GitHub API 返回非数组，跳过')
              exit(0)

          print(f'GitHub 共 {len(releases)} 个 Release，开始同步...')

          for rel in releases:
              tag = rel['tag_name']
              name = rel.get('name') or tag
              body = rel.get('body') or ''
              status = 'pre' if rel.get('prerelease') else 'latest'

              payload = json.dumps({
                  'tag_name': tag, 'name': name, 'body': body, 'release_status': status
              }).encode()

              # 检查 GitCode 是否已有该 tag 的 Release
              try:
                  api_get(f'{GITCODE_API}/releases/tags/{tag}?access_token={GITCODE_TOKEN}')
                  exists = True
              except urllib.error.HTTPError:
                  exists = False

              if exists:
                  api_json(f'{GITCODE_API}/releases/{tag}?access_token={GITCODE_TOKEN}',
                      headers={'Content-Type': 'application/json'}, data=payload, method='PATCH')
                  print(f'更新 Release: {tag}')
              else:
                  api_json(f'{GITCODE_API}/releases?access_token={GITCODE_TOKEN}',
                      headers={'Content-Type': 'application/json'}, data=payload, method='POST')
                  print(f'创建 Release: {tag}')

              # 同步 assets（APK 等附件）
              assets = rel.get('assets', [])
              if assets:
                  print(f'  {len(assets)} 个附件，开始上传...')
              for asset in assets:
                  asset_name = asset['name']
                  asset_url = asset['browser_download_url']
                  asset_size = asset.get('size', 0)
                  print(f'  下载 {asset_name}（{asset_size // 1024 // 1024}MB）...')

                  # 下载 GitHub asset
                  try:
                      resp = api_get(asset_url, headers={'Authorization': f'token {GH_TOKEN}'})
                      data = resp.read()
                  except Exception as e:
                      print(f'  下载失败: {asset_name}: {e}')
                      continue

                  # 获取 GitCode 预签名上传 URL
                  try:
                      upload_resp = api_json(
                          f'{GITCODE_API}/releases/{tag}/upload_url?access_token={GITCODE_TOKEN}'
                          f'&file_name={urllib.parse.quote(asset_name)}')
                  except Exception as e:
                      print(f'  获取 upload_url 失败: {asset_name}: {e}')
                      continue

                  upload_url = upload_resp.get('url')
                  upload_headers = upload_resp.get('headers', {})
                  if not upload_url:
                      print(f'  upload_url 为空: {asset_name}')
                      continue

                  # PUT 上传到华为 OBS 预签名 URL
                  try:
                      req = urllib.request.Request(upload_url, data=data, method='PUT', headers=upload_headers)
                      urllib.request.urlopen(req)
                      print(f'  上传完成: {asset_name}')
                  except Exception as e:
                      print(f'  上传失败: {asset_name}: {e}')

          print('Release 同步完成')
          PYEOF
