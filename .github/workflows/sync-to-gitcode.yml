name: Sync to GitCode

# 每天北京时间 0:00 / 6:00 / 12:00 / 18:00 自动同步到 GitCode 镜像仓库
# 也支持手动触发
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # UTC 时间，对应北京时间 0/6/12/18
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 强制推送代码与 Tag 到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git remote add gitcode https://qldwi:${GITCODE_TOKEN}@gitcode.com/qldwi/aiverse.git
          git push gitcode main --force --tags
          git remote remove gitcode

      - name: 同步 Release 公告到 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          # 从 GitHub 获取所有 Release（tag + 标题 + 正文 + 是否预发布）
          GITHUB_RELEASES=$(curl -s "https://api.github.com/repos/yhdmgf/AiVerse/releases?per_page=100")

          echo "$GITHUB_RELEASES" | jq -c '.[]' | while read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            PRERELEASE=$(echo "$release" | jq -r '.prerelease')

            STATUS="latest"
            [ "$PRERELEASE" = "true" ] && STATUS="pre"

            # 构造 JSON payload（jq 安全转义特殊字符）
            PAYLOAD=$(jq -n \
              --arg tag "$TAG" --arg name "$NAME" --arg body "$BODY" --arg status "$STATUS" \
              '{tag_name: $tag, name: $name, body: $body, release_status: $status}')

            # 检查 GitCode 是否已有该 tag 的 Release
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/tags/${TAG}?access_token=${GITCODE_TOKEN}")

            if [ "$HTTP" = "200" ]; then
              # 已存在 → 获取 id 后 PATCH 更新
              RID=$(curl -s \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/tags/${TAG}?access_token=${GITCODE_TOKEN}" \
                | jq -r '.id')
              curl -s -X PATCH \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases/${RID}?access_token=${GITCODE_TOKEN}" \
                -H "Content-Type: application/json" -d "$PAYLOAD"
              echo "更新 Release: $TAG"
            else
              # 不存在 → POST 创建
              curl -s -X POST \
                "https://api.gitcode.com/api/v5/repos/qldwi/aiverse/releases?access_token=${GITCODE_TOKEN}" \
                -H "Content-Type: application/json" -d "$PAYLOAD"
              echo "创建 Release: $TAG"
            fi
          done
